default:
  tags:
    - zarechkin-11

stages:
  - proverka

shellcheck:
  stage: proverka
  image: koalaman/shellcheck-alpine:stable
  script:
    - echo "Вариант 11, слово devlab"
    - shellcheck --version
    - find . -name '*.sh' ! -path './work-01/commands.sh' -print
    - find . -name '*.sh' ! -path './work-01/commands.sh' -exec shellcheck {} +
