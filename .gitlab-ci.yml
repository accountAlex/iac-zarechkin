default:
  tags:
    - zarechkin-11

stages:
  - proverka
  - cloud

shellcheck:
  stage: proverka
  image: koalaman/shellcheck-alpine:stable
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
      changes:
        - "**/*.sh"
        - ".gitlab-ci.yml"
    - when: never
  script:
    - echo "Вариант 11, слово devlab"
    - shellcheck --version
    - find . -name '*.sh' ! -path './work-01/commands.sh' -print
    - find . -name '*.sh' ! -path './work-01/commands.sh' -exec shellcheck {} +

yamllint:
  stage: proverka
  image: python:3.12-alpine
  before_script:
    - pip install --no-cache-dir yamllint
  script:
    - echo "Проверка YAML, вариант 11, слово devlab"
    - yamllint --version
    - yamllint -c .yamllint .gitlab-ci.yml hw-01/cloud-init.tpl.yaml work-02/cloud-init.tpl.yaml

.yc:
  image: alpine:3.20
  before_script:
    - apk add --no-cache bash curl jq gettext openssh-client
    - curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash
    - export PATH="$HOME/yandex-cloud/bin:$PATH"
    - yc config profile create ci
    - yc config set service-account-key "$YC_KEY_TEST"
    - yc config set cloud-id "$YC_CLOUD_ID"
    - yc config set folder-id "$YC_FOLDER_ID"

cloud-access:
  extends: .yc
  stage: cloud
  when: manual
  script:
    - echo "Проверяю доступ, вариант 11, слово devlab"
    - yc vpc network list

stend-p2:
  extends: .yc
  stage: cloud
  when: manual
  variables:
    PREFIX: zarechkin-11
    GREETING: devlab
    RUNNER_AFTER_SCRIPT_TIMEOUT: 15m
  script:
    - echo "Стенд второй работы из пайплайна, вариант 11, префикс $PREFIX, слово $GREETING"
    - mkdir -p ~/.ssh
    - ssh-keygen -t ed25519 -N "" -f ~/.ssh/id_ed25519 -q
    - bash work-02/create.sh
    - bash work-02/check-lb.sh
  after_script:
    - export PATH="$HOME/yandex-cloud/bin:$PATH"
    - echo "Уборка стенда, префикс $PREFIX"
    - bash work-02/destroy.sh

# Общая конфигурация для проверок Terraform
.terraform:
  image:
    name: hashicorp/terraform:1.15.8
    entrypoint: [""]
  before_script:
    - |
      cat > /tmp/terraformrc <<'EOF'
      provider_installation {
        network_mirror {
          url     = "https://terraform-mirror.yandexcloud.net/"
          include = ["registry.terraform.io/*/*"]
        }
        direct {
          exclude = ["registry.terraform.io/*/*"]
        }
      }
      EOF
    - export TF_CLI_CONFIG_FILE=/tmp/terraformrc

terraform-fmt:
  extends: .terraform
  stage: proverka
  script:
    - terraform -chdir=hw-02 fmt -check -diff -recursive

terraform-validate:
  extends: .terraform
  stage: proverka
  script:
    - terraform -chdir=hw-02 init -backend=false
    - terraform -chdir=hw-02 validate
