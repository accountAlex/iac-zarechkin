#cloud-config
users:
  - name: student
    groups: sudo
    shell: /bin/bash
    sudo: ['ALL=(ALL) NOPASSWD:ALL']
    ssh_authorized_keys:
      - ${ssh_key}

packages:
  - nginx

write_files:
  - path: /etc/nginx/.htpasswd
    owner: root:root
    permissions: '0600'
    content: |
      ${basic_auth_user}:${basic_auth_hash}

  - path: /etc/nginx/auth-settings.conf
    owner: root:root
    permissions: '0644'
    content: |
      auth_basic "Restricted";
      auth_basic_user_file /etc/nginx/.htpasswd;

runcmd:
  - sed -i 's/listen 80 default_server;/listen ${app_port} default_server;/' /etc/nginx/sites-available/default
  - >-
    sed -i 's/listen \[::\]:80 default_server;/listen [::]:${app_port} default_server;/'
    /etc/nginx/sites-available/default
  - bash -c 'echo "${greeting} on $(hostname)" > /var/www/html/index.nginx-debian.html'
  - sed -i '/server_name _;/a\        include /etc/nginx/auth-settings.conf;' /etc/nginx/sites-available/default
  - nginx -t
  - systemctl restart nginx
